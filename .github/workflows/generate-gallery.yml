name: Update Gallery HTML

on:
  push:
    paths:
      - 'photos/gallery/**'
      - 'generate_gallery.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update galerie.html
        run: python generate_gallery.py

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add galerie.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update galerie.html [skip ci]" && git push)
