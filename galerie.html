<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie | Větrníkovo</title>
    <meta name="description" content="Galerie bistro-cukrárny Větrníkovo.">
    <link rel="canonical" href="https://vetrnikovo.cz/galerie">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vetrnikovo.cz/galerie">
    <meta property="og:title" content="Galerie | Větrníkovo">
    <meta property="og:description" content="Galerie bistro-cukrárny Větrníkovo.">
    <meta property="og:image" content="https://vetrnikovo.cz/photos/card.jpg">
    <meta property="og:locale" content="cs_CZ">
    <meta property="og:site_name" content="Větrníkovo">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://vetrnikovo.cz/galerie">
    <meta name="twitter:title" content="Galerie | Větrníkovo">
    <meta name="twitter:description" content="Galerie bistro-cukrárny Větrníkovo.">
    <meta name="twitter:image" content="https://vetrnikovo.cz/photos/card.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="photos/logo-white.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="photos/logo-yellow.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="photos/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Abhaya+Libre:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6">
</head>

<body>

    <!-- Top bar -->
    <header class="top-bar" id="top-bar">
        <div class="top-bar__spacer"></div>
        <a href="/" class="top-bar__logo">
            <img src="photos/vetrnikovo-white.png" alt="Větrníkovo logo" class="top-bar__logo-img">
        </a>
        <button class="hamburger" id="hamburger-btn" aria-label="Otevřít menu" aria-expanded="false">
            <img src="photos/logo-white.png" alt="" class="hamburger__icon">
        </button>
    </header>

    <!-- Overlay -->
    <div class="menu-overlay" id="menu-overlay"></div>

    <!-- Slide-in menu -->
    <nav class="slide-menu" id="slide-menu" aria-label="Hlavní navigace">
        <button class="slide-menu__close" id="menu-close-btn" aria-label="Zavřít menu">
            <span>&times;</span>
        </button>
        <ul class="slide-menu__list">
            <li class="slide-menu__item"><a href="/" class="slide-menu__link">Úvod</a></li>
            <li class="slide-menu__item"><a href="/#eventy" class="slide-menu__link">Eventy</a></li>
            <li class="slide-menu__item"><a href="/o-nas" class="slide-menu__link">O nás</a></li>
            <li class="slide-menu__item"><a href="/galerie" class="slide-menu__link">Galerie</a></li>
            <li class="slide-menu__item"><a href="#kontakt" class="slide-menu__link">Kontakt</a></li>
        </ul>
    </nav>

    <!-- Main content -->
    <main>

        <!-- Story Section -->
        <section class="about-story" id="galerie">
            <!-- Left decorative column -->
            <div class="about-story__side about-story__side--left">
                <img src="photos/logo-yellow-light.png" alt="" class="about-story__deco about-story__deco--1"
                    aria-hidden="true">
                <img src="photos/logo-yellow-light.png" alt="" class="about-story__deco about-story__deco--3"
                    aria-hidden="true">
            </div>

            <!-- Center column -->
            <div class="about-story__center">
                <div class="about-story__content about-story__content--gallery">
                    <h1 class="about-story__heading">Galerie</h1>

                    <div class="gallery-albums" id="gallery-albums">
                        <!-- Alby se načtou automaticky z photos/gallery.json -->
                    </div>
                </div>
            </div>

            <!-- Right decorative column -->
            <div class="about-story__side about-story__side--right">
                <img src="photos/logo-yellow-light.png" alt="" class="about-story__deco about-story__deco--4"
                    aria-hidden="true">
                <img src="photos/logo-yellow-light.png" alt="" class="about-story__deco about-story__deco--6"
                    aria-hidden="true">
            </div>
        </section>

        <!-- Contact section -->
        <section class="contact" id="kontakt">
            <div class="contact__inner">
                <div class="contact__info">
                    <h2 class="contact__title">Kontakt</h2>

                    <div class="contact__block">
                        <h3 class="contact__label">Větrníkovo s.r.o.</h3>
                        <p>IČO 24899976</p>
                    </div>

                    <div class="contact__block">
                        <h3 class="contact__label">Otevírací doba</h3>
                        <p>Po – Pá: 8:00 – 17:00</p>
                        <p>So – Ne: zavřeno</p>
                    </div>

                    <div class="contact__block">
                        <h3 class="contact__label">Adresa</h3>
                        <p>Komunardů 1490/47</p>
                        <p>170 00 Praha, Holešovice</p>
                    </div>

                    <div class="contact__block">
                        <h3 class="contact__label">Telefon</h3>
                        <p><a href="tel:+420734712172" class="contact__link">+420 734 712 172</a></p>
                    </div>

                    <div class="contact__block">
                        <h3 class="contact__label">E-mail</h3>
                        <p><a href="mailto:info@vetrnikovo.cz" class="contact__link">info@vetrnikovo.cz</a></p>
                    </div>
                </div>

                <div class="contact__map">
                    <iframe
                        src="https://www.google.com/maps?q=V%C4%9Btrn%C3%ADkovo,+Komunard%C5%AF+1490/47,+Praha&output=embed"
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade" title="Větrníkovo na mapě">
                    </iframe>
                </div>
            </div>
        </section>

    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Galerie fotografií">
        <button class="lightbox__close" id="lightbox-close" aria-label="Zavřít">&times;</button>
        <button class="lightbox__arrow lightbox__arrow--prev" id="lightbox-prev" aria-label="Předchozí">&#8249;</button>
        <div class="lightbox__content">
            <div class="lightbox__stage">
                <img class="lightbox__img" id="lightbox-img" src="" alt="">
            </div>
            <div class="lightbox__thumbs" id="lightbox-thumbs" aria-label="Miniatury fotek v galerii"></div>
        </div>
        <button class="lightbox__arrow lightbox__arrow--next" id="lightbox-next" aria-label="Další">&#8250;</button>
    </div>

    <script src="main.js" defer></script>
</body>

</html>
